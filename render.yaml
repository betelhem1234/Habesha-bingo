services:
  - type: web
    name: habesha-bingo
    runtime: docker
    repo: https://github.com/kalabgezahegn1234-cell/ethio-bingo
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: BINGO_APP_URL
        sync: false
