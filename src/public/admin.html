<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <header>
            <h1><span class="gradient-text">Bingo</span> Admin</h1>
            <div class="status-indicator">
                <span class="pulse"></span> Live Connection
            </div>
            <a href="/admin-stats.html" class="btn-primary" style="margin-top:10px; text-decoration:none;">📊 Dashboard Stats</a>
        </header>

        <main>
            <section class="stats-grid">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p class="stat-value" id="stat-users">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Balance</h3>
                    <p class="stat-value"><span id="stat-balance">0</span> <span class="currency">Birr</span></p>
                </div>
                <div class="stat-card">
                    <h3>Active Players</h3>
                    <p class="stat-value" id="stat-players">0</p>
                </div>
                <div class="stat-card game-control">
                    <h3>Game State</h3>
                    <p class="stat-value" id="stat-state">WAITING</p>
                    <button id="btn-start" class="btn-primary">Force Start Game</button>
                </div>
                <div class="stat-card voice-control">
                    <h3>Caller Voice (ድምፅ)</h3>
                    <p class="stat-value" id="stat-voice" style="font-size:1.1rem;">Loading...</p>
                    <div style="display:flex; gap:6px; margin-top:8px;">
                        <button onclick="setAdminVoice('male')" class="btn-primary" style="margin:0; padding:6px 10px; font-size:12px; background:#1976d2; border:none; cursor:pointer;">👨 Male</button>
                        <button onclick="setAdminVoice('female')" class="btn-primary" style="margin:0; padding:6px 10px; font-size:12px; background:#e91e63; border:none; cursor:pointer;">👩 Female</button>
                    </div>
                </div>
            </section>

            <section class="users-section">
                <h2>Top Users</h2>
                <div class="table-container">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Balance (Birr)</th>
                                <th>Referrals</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="users-section">
                <h2>Deposit / Withdraw Requests</h2>
                <div class="req-filter" style="margin-bottom: 12px; display:flex; gap:8px;">
                    <button class="btn-primary" id="filter-pending" style="margin:0;">Pending</button>
                    <button class="btn-primary" id="filter-approved" style="margin:0;">Approved</button>
                    <button class="btn-primary" id="filter-rejected" style="margin:0;">Rejected</button>
                    <button class="btn-primary" id="filter-all" style="margin:0;">All</button>
                </div>
                <div class="table-container">
                    <table id="req-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>User</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Balance</th>
                                <th>Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
    <script>
        async function loadVoice(){
            try{
                const r = await fetch('/api/admin/voice');
                const d = await r.json();
                const el = document.getElementById('stat-voice');
                if(el && d && d.voice){
                    el.textContent = d.voice === 'female' ? '👩 Female (ሴት)' : '👨 Male (ወንድ)';
                    el.style.color = d.voice === 'female' ? '#ff80ab' : '#90caf9';
                }
            }catch(e){}
        }
        async function setAdminVoice(v){
            try{
                const r = await fetch('/api/admin/voice', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({voice:v})
                });
                const d = await r.json();
                if(d.success) loadVoice();
            }catch(e){}
        }
        loadVoice();
    </script>
</body>
</html>
