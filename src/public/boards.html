<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ethio Bingo — Choose Boards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/auth-client.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  background: #dcd0ea;
  height: 100vh;
  height: 100dvh;
  max-height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding-bottom: 54px;
  color: #2c1b4d;
  box-sizing: border-box;
}

/* ─── Top App Header ─── */
.app-header {
  width: 100%;
  background: #1e1a38;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 0 14px;
  padding-top: env(safe-area-inset-top, 0px);
  min-height: calc(42px + env(safe-area-inset-top, 0px));
  font-size: 1.02rem;
  font-weight: 800;
  box-sizing: border-box;
  flex-shrink: 0;
}
.app-header-title {
  font-size: 1.02rem;
  font-weight: 800;
  letter-spacing: 0.3px;
  color: #ffffff;
}

/* ─── Top Action & Stats Bar (5 Items) ─── */
.top-action-bar {
  width: 100%;
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr 1fr 1.1fr;
  gap: 4px;
  padding: 4px 8px 3px;
  flex-shrink: 0;
}
.top-btn {
  background: #5e1261;
  color: #fff;
  border: none;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3px 2px;
  cursor: pointer;
  box-shadow: 0 1px 4px rgba(94, 18, 97, 0.25);
  transition: transform 0.1s;
}
.top-btn:active {
  transform: scale(0.95);
}
.top-btn .t-icon {
  font-size: 0.85rem;
  margin-bottom: 1px;
}
.top-btn .t-label {
  font-size: 0.65rem;
  font-weight: 800;
}

.top-pill {
  background: #fff;
  border: 1px solid #c9b3e8;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px 2px;
  text-align: center;
  box-shadow: 0 1px 3px rgba(74, 21, 75, 0.08);
}
.top-pill .p-label {
  font-size: 0.52rem;
  color: #6b4d8a;
  font-weight: 800;
  margin-bottom: 1px;
}
.top-pill .p-value {
  font-size: 0.75rem;
  font-weight: 900;
  color: #3b1e5a;
}

/* Prominent Orange Countdown Box (Item 2) */
.countdown-pill {
  background: #fff;
  border: 1px solid #c9b3e8;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 4px rgba(243, 156, 18, 0.15);
}
.countdown-pill .cd-val {
  font-size: 1.35rem;
  font-weight: 900;
  color: #f39c12;
  line-height: 1;
}

/* ─── Sub-Header Status Rows ─── */
.status-sub-row {
  width: 100%;
  padding: 2px 10px 4px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
  box-sizing: border-box;
}
.status-sub-line1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.status-sub-line2 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.sub-boards-label {
  color: #009944;
  font-size: 0.85rem;
  font-weight: 900;
}
.sub-stake-label {
  color: #009944;
  font-size: 0.85rem;
  font-weight: 900;
}

/* ─── Board Grid Card Container ─── */
.board-grid-wrapper {
  width: calc(100% - 14px);
  background: #ece3f7;
  border: 2px solid #b8a6d6;
  border-radius: 14px;
  padding: 4px;
  flex: 1 1 auto;
  min-height: 150px;
  max-height: calc(100dvh - 315px);
  display: flex;
  flex-direction: column;
  box-shadow: 0 2px 8px rgba(74, 21, 75, 0.08);
  box-sizing: border-box;
  overflow: hidden;
}
.board-grid {
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  gap: 3px;
  overflow-y: auto;
  padding: 2px;
  height: 100%;
}
.board-grid::-webkit-scrollbar {
  width: 4px;
}
.board-grid::-webkit-scrollbar-thumb {
  background: #c2b1db;
  border-radius: 4px;
}

.board-cell {
  aspect-ratio: 1.15;
  border-radius: 6px;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.72rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.1s;
  user-select: none;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
  /* Default / Unselected: Neutral light lavender-grey with bold black text */
  background: #c2b1db;
  color: #000000;
}
.board-cell:active {
  transform: scale(0.92);
}

/* Taken by Other Players: Solid Orange with BOLD BLACK TEXT */
.board-cell.taken {
  background: #ff7a00;
  color: #000000;
  font-weight: 900;
  cursor: not-allowed;
  box-shadow: 0 1px 3px rgba(255, 122, 0, 0.3);
}

/* Selected by Current User: Solid Green with BOLD BLACK TEXT */
.board-cell.selected {
  background: #009944;
  color: #000000;
  font-weight: 900;
  box-shadow: 0 0 8px rgba(0, 153, 68, 0.6);
  animation: sel-pulse 1s infinite alternate;
}
@keyframes sel-pulse {
  from {
    box-shadow: 0 0 4px #009944;
  }
  to {
    box-shadow: 0 0 10px #009944;
  }
}

/* ─── Selected Board Preview Section ─── */
.previews-wrapper {
  width: 100%;
  flex-shrink: 0;
  padding: 4px 8px 6px;
  display: flex;
  justify-content: center;
  box-sizing: border-box;
}
.previews-container {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
}
.mini-cartela-box {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.mini-cartela-title {
  color: #009944;
  font-size: 0.85rem;
  font-weight: 900;
  margin-bottom: 3px;
}
.mini-cartela-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 3px;
  background: rgba(255, 255, 255, 0.7);
  padding: 5px;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}
.mini-c-cell {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: #e8dff0;
  color: #2c1b4d;
  font-size: 0.65rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}
.mini-c-cell.free {
  background: #009944;
  color: #fff;
  font-weight: 900;
  font-size: 0.75rem;
}

/* ─── Bottom App Navigation Bar ─── */
.bottom-nav-bar{
  position:fixed;bottom:0;left:0;width:100%;
  background:#fff;border-top:1px solid #dcd0ea;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:4px 0 6px;z-index:95;
  max-width:440px;left:50%;transform:translateX(-50%);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:#888;text-decoration:none;font-size:0.62rem;font-weight:700;
  cursor:pointer;
}
.nav-item.active{color:#5e1261;}
.nav-item.active .nav-icon-bg{
  background:#5e1261;color:#fff;border-radius:12px;padding:2px 12px;
}
.nav-icon{font-size:1.05rem;}

/* ─── Auto-Play Pill in Lobby ─── */
.auto-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:#d1c4e9;padding:3px 8px;border-radius:12px;
  cursor:pointer;font-size:0.72rem;font-weight:800;color:#5e1261;
  transition:all 0.15s ease;
  user-select:none;
}
.auto-pill:active{transform:scale(0.94);}
.auto-state-badge{
  background:#27ae60;color:#fff;
  padding:2px 7px;border-radius:9px;font-size:0.62rem;font-weight:900;
}
.auto-state-badge.off{background:#c0b2d4;color:#5e1261;}

/* ─── Sound Pill in Lobby ─── */
.sound-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:#d1c4e9;padding:3px 8px;border-radius:12px;
  cursor:pointer;font-size:0.72rem;font-weight:800;color:#5e1261;
  transition:all 0.15s ease;
  user-select:none;
}
.sound-pill:active{transform:scale(0.94);}
.sound-state-badge{
  background:#27ae60;color:#fff;
  padding:2px 7px;border-radius:9px;font-size:0.62rem;font-weight:900;
  display:inline-flex;align-items:center;gap:2px;
}
.sound-state-badge.off{background:#c0b2d4;color:#5e1261;}

/* ─── Validation / Feedback Toast ─── */
.validation-toast{
  position:fixed;bottom:85px;left:50%;transform:translateX(-50%) translateY(20px);
  background:rgba(30,26,56,0.95);color:#fff;
  padding:8px 18px;border-radius:20px;
  font-size:0.78rem;font-weight:700;
  box-shadow:0 4px 15px rgba(0,0,0,0.35);
  opacity:0;pointer-events:none;
  transition:all 0.25s ease;
  z-index:9999;
  text-align:center;max-width:90%;
}
.validation-toast.show{
  opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<!-- ─── Top App Header ─── -->
<div class="app-header">
  <span class="app-header-title">Ethio Bingo</span>
</div>

<!-- ─── Top Action & Stats Bar (5 Items - Reference Image) ─── -->
<div class="top-action-bar">
  <button class="top-btn" onclick="exitGame()">
    <span class="t-icon">←</span>
    <span class="t-label">Leave</span>
  </button>
  <div class="countdown-pill">
    <span class="cd-val" id="timer">30</span>
  </div>
  <div class="top-pill">
    <span class="p-label">Wallet</span>
    <span class="p-value" id="wallet-val">—</span>
  </div>
  <div class="top-pill">
    <span class="p-label">Stake</span>
    <span class="p-value" id="stake-val">—</span>
  </div>
  <button class="top-btn" onclick="poll()">
    <span class="t-icon">↻</span>
    <span class="t-label">Refresh</span>
  </button>
</div>

<!-- ─── Sub-Header Status Row ─── -->
<div class="status-sub-row">
  <div class="status-sub-line1">
    <div style="display:flex;align-items:center;gap:6px;">
      <span class="sub-boards-label" id="boards-counter">Boards: 0/2</span>
      <div class="auto-pill" id="lobby-auto-pill" onclick="toggleLobbyAuto()" title="Toggle Auto-Play">
        <span>Auto</span>
        <span class="auto-state-badge off" id="lobby-auto-badge">OFF</span>
      </div>
      <div class="sound-pill" id="lobby-sound-pill" onclick="toggleLobbySound()" title="Toggle Sound">
        <span>Sound</span>
        <span class="sound-state-badge" id="lobby-sound-badge">🔊 ON</span>
      </div>
    </div>
    <span class="sub-stake-label" id="stake-label">10 № 1</span>
  </div>
  <div class="status-sub-line2">
    <span id="room-stats-label" style="color:#5e1261; font-size:0.72rem; font-weight:900;">👥 <span id="room-players">0</span> (<span id="room-boards">0</span> 📋) | 💰 <span id="room-derash">0</span> Birr</span>
  </div>
</div>

<!-- ─── Board Grid Card Container ─── -->
<div class="board-grid-wrapper">
  <div class="board-grid" id="board-grid"></div>
</div>

<!-- ─── Selected Board Preview Section ─── -->
<div class="previews-wrapper" id="previews-wrapper" style="display:none;">
  <div class="previews-container" id="previews-container"></div>
</div>

<!-- ─── Bottom App Navigation Bar ─── -->
<div class="bottom-nav-bar">
  <div class="nav-item active" onclick="exitGame()">
    <div class="nav-icon-bg"><span class="nav-icon">🎮</span></div>
    <span>Game</span>
  </div>
  <a class="nav-item" id="nav-history" href="/history.html">
    <span class="nav-icon">🕒</span>
    <span>History</span>
  </a>
  <a class="nav-item" id="nav-wallet" href="/wallet.html">
    <span class="nav-icon">💼</span>
    <span>Wallet</span>
  </a>
  <a class="nav-item" id="nav-profile" href="/profile.html">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>
</div>

<script>
if(window.Telegram?.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  if(typeof Telegram.WebApp.requestFullscreen === 'function'){
    try { Telegram.WebApp.requestFullscreen(); } catch(e){}
  }
}
const params=new URLSearchParams(location.search);
let userId=params.get('userId');
if(!userId || userId==='0'){
  if(window.Telegram?.WebApp?.initDataUnsafe?.user?.id){
    userId=String(Telegram.WebApp.initDataUnsafe.user.id);
  } else {
    try { userId=sessionStorage.getItem('bingo_userId')||'0'; } catch(e){ userId='0'; }
  }
}
if(userId && userId!=='0'){
  try { sessionStorage.setItem('bingo_userId', userId); } catch(e){}
}

let token=params.get('token');
if(!token){
  try { token=sessionStorage.getItem('bingo_token')||''; } catch(e){}
}
if(token){
  try { sessionStorage.setItem('bingo_token', token); } catch(e){}
}

const bet=params.get('bet')||'10';
const room=params.get('room')||'1';

// Setup nav links
const tokParam = token ? `&token=${encodeURIComponent(token)}` : '';
document.getElementById('nav-history').href=`/history.html?userId=${userId}${tokParam}`;
document.getElementById('nav-wallet').href=`/wallet.html?userId=${userId}${tokParam}`;
document.getElementById('nav-profile').href=`/profile.html?userId=${userId}${tokParam}`;

let selectedBoards=[]; // Array of 1 or 2 board numbers
let confirmedBoards=[]; // Array of board numbers confirmed by the server
let pendingSelection=null;
let isJoining=false;
let currentSyncPromise=null;
let lastSyncTimestamp=0;
let cachedBoards=[];
let targetEndTime=0;
let countdownActive=false;
let smoothTimer=null;
let lastDisplayedSec=-1;
let redirected=false;

// Set initial labels
document.getElementById('stake-label').textContent=`${bet} № ${room}`;
document.getElementById('timer').textContent='30';

let autoEnabled=false;
try{
  const stored=localStorage.getItem('bingo_auto_play');
  if(stored !== null){
    autoEnabled = stored === 'true';
  } else if(params.get('auto') !== null){
    autoEnabled = params.get('auto') === '1';
  }
}catch(e){}

let wakeLock=null;
async function requestWakeLock(){
  if(autoEnabled && 'wakeLock' in navigator){
    try{
      wakeLock = await navigator.wakeLock.request('screen');
    }catch(e){}
  }
}

function releaseWakeLock(){
  if(wakeLock){
    try{ wakeLock.release(); }catch(e){}
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && autoEnabled){
    requestWakeLock();
  }
});

function updateLobbyAutoBadge(){
  const badge=document.getElementById('lobby-auto-badge');
  if(badge){
    badge.textContent = autoEnabled ? 'ON' : 'OFF';
    badge.className = autoEnabled ? 'auto-state-badge' : 'auto-state-badge off';
  }
}

const urlSound=params.get('sound');
let soundEnabled=true;
try{
  const storedSound=localStorage.getItem('bingo_sound_enabled');
  if(storedSound !== null){
    soundEnabled = storedSound === 'true';
  } else if(urlSound !== null){
    soundEnabled = urlSound === '1';
  }
}catch(e){}

function updateLobbySoundBadge(){
  const badge=document.getElementById('lobby-sound-badge');
  if(badge){
    badge.textContent = soundEnabled ? '🔊 ON' : '🔇 OFF';
    badge.className = soundEnabled ? 'sound-state-badge' : 'sound-state-badge off';
  }
}

function toggleLobbySound(){
  soundEnabled = !soundEnabled;
  try{
    localStorage.setItem('bingo_sound_enabled', soundEnabled ? 'true' : 'false');
  }catch(e){}
  updateLobbySoundBadge();
  if(soundEnabled){
    showToast('🔊 Sound ON: Game calls will be spoken aloud');
  }else{
    showToast('🔇 Sound OFF: Game calls will be muted');
  }
}

function showToast(msg){
  const toast=document.getElementById('validation-toast');
  if(!toast) return;
  toast.textContent = msg;
  toast.classList.add('show');
  if(window._toastTimeout) clearTimeout(window._toastTimeout);
  window._toastTimeout = setTimeout(()=>{
    toast.classList.remove('show');
  }, 2400);
}

function toggleLobbyAuto(){
  autoEnabled = !autoEnabled;
  try{
    localStorage.setItem('bingo_auto_play', autoEnabled ? 'true' : 'false');
  }catch(e){}
  updateLobbyAutoBadge();
  if(autoEnabled){
    requestWakeLock();
    showToast('⚡ Auto-Play ON: Your numbers will be marked & claimed automatically!');
  }else{
    releaseWakeLock();
    showToast('Auto-Play OFF (Manual Play)');
  }
  if(userId && userId !== '0'){
    fetch('/api/player/autoplay',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({userId,autoPlay:autoEnabled,bet,room})
    }).catch(()=>{});
  }
}

updateStakeDisplay();
updateLobbyAutoBadge();
updateLobbySoundBadge();
if(autoEnabled) requestWakeLock();

function updateStakeDisplay(){
  const count=selectedBoards.length;
  const total=count*parseInt(bet,10);
  document.getElementById('stake-val').textContent=`${total}`;
  document.getElementById('boards-counter').textContent=`Boards: ${count}/2`;
}

function mulberry32(seed){
  return function(){
    seed|=0;seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

let currentShuffleSeed = 0;
try {
  currentShuffleSeed = Number(sessionStorage.getItem('lastShuffleSeed') || 0);
} catch(e){}

function combineSeedClient(boardNumber, shuffleSalt){
  if(!shuffleSalt) return boardNumber;
  let h = (boardNumber ^ Math.imul(shuffleSalt, 0x5DEECE66)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85ebca6b) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

function generateTicketClient(boardNum, shuffleSalt = 0){
  const effectiveSeed = combineSeedClient(boardNum, shuffleSalt);
  const rand=mulberry32(effectiveSeed);
  const ticket=[];
  for(let i=0;i<5;i++) ticket[i]=[];
  const ranges=[
    {min:1,max:15},{min:16,max:30},{min:31,max:45},{min:46,max:60},{min:61,max:75}
  ];
  for(let col=0;col<5;col++){
    const numbers=new Set();
    while(numbers.size<5){
      const num=Math.floor(rand()*(ranges[col].max-ranges[col].min+1))+ranges[col].min;
      numbers.add(num);
    }
    const colNums=Array.from(numbers);
    for(let row=0;row<5;row++){
      if(col===2&&row===2){
        ticket[row][col]=0;
      }else{
        ticket[row][col]=colNums[row];
      }
    }
  }
  return ticket;
}

function renderPreviews(){
  const wrapper=document.getElementById('previews-wrapper');
  const container=document.getElementById('previews-container');

  if(!selectedBoards||selectedBoards.length===0){
    wrapper.style.display='none';
    return;
  }

  wrapper.style.display='flex';

  container.innerHTML=selectedBoards.map(boardNum=>{
    const ticket=generateTicketClient(boardNum, currentShuffleSeed);
    let gridHtml='';
    for(let r=0;r<5;r++){
      for(let c=0;c<5;c++){
        const num=ticket[r][c];
        if(num===0){
          gridHtml+=`<div class="mini-c-cell free">*</div>`;
        }else{
          gridHtml+=`<div class="mini-c-cell">${num}</div>`;
        }
      }
    }
    return `
      <div class="mini-cartela-box">
        <div class="mini-cartela-title">Cartela #${boardNum}</div>
        <div class="mini-cartela-grid">${gridHtml}</div>
      </div>
    `;
  }).join('');
}

function renderBoards(boardsOrTaken){
  cachedBoards=boardsOrTaken;
  let takenSet;
  if(Array.isArray(boardsOrTaken) && (boardsOrTaken.length === 0 || typeof boardsOrTaken[0] === 'number')){
    takenSet = new Set(boardsOrTaken);
  } else if(Array.isArray(boardsOrTaken) && boardsOrTaken[0] && typeof boardsOrTaken[0] === 'object'){
    takenSet = new Set(boardsOrTaken.filter(b => b.taken).map(b => b.number));
  } else {
    takenSet = new Set();
  }
  const grid=document.getElementById('board-grid');
  let html='';
  for(let i=1; i<=500; i++){
    const isMine=selectedBoards.includes(i);
    const taken=takenSet.has(i);
    let cls='board-cell';
    if(isMine) cls+=' selected';
    else if(taken) cls+=' taken';
    const disabled=taken&&!isMine;
    html += `<button class="${cls}" onclick="pickBoard(${i})" ${disabled?'disabled':''}>${i}</button>`;
  }
  grid.innerHTML=html;
}

async function syncBoardSelection(){
  if(isJoining) return currentSyncPromise;
  isJoining=true;
  currentSyncPromise = (async () => {
    try{
      while(pendingSelection !== null){
        const boardsToSync = pendingSelection;
        pendingSelection = null;
        const res = await fetch('/api/join',{
          method:'POST',
          headers:{
            'Content-Type':'application/json',
            'x-telegram-init-data': window.Telegram?.WebApp?.initData || '',
            'x-player-token': token || ''
          },
          body:JSON.stringify({userId,boards:boardsToSync,bet,room,autoPlay:autoEnabled})
        });
        lastSyncTimestamp = Date.now();
        const data = await res.json();
        if(data.success){
          if(data.boards && Array.isArray(data.boards)){
            confirmedBoards = [...data.boards];
            selectedBoards = [...data.boards];
          }
          renderPreviews();
          updateStakeDisplay();
          if(cachedBoards.length>0) renderBoards(cachedBoards);
          if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
          poll();
          loadBalance();
        }else{
          // Roll back visual selection to server-confirmed state
          if(data.boards && Array.isArray(data.boards)){
            confirmedBoards = [...data.boards];
          }
          selectedBoards = [...confirmedBoards];
          renderPreviews();
          updateStakeDisplay();
          if(cachedBoards.length>0) renderBoards(cachedBoards);

          if(data.msg && data.msg.toLowerCase().includes('in progress')){
            redirected = true;
            if(smoothTimer) clearInterval(smoothTimer);
            if(confirmedBoards.length > 0){
              window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&boards=${confirmedBoards.join(',')}&auto=${autoEnabled?'1':'0'}&sound=${soundEnabled?'1':'0'}&v=${Date.now()}`;
            }else{
              window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&spectator=1&auto=${autoEnabled?'1':'0'}&sound=${soundEnabled?'1':'0'}&v=${Date.now()}`;
            }
            return;
          }
          alert(data.msg||'Failed to update board selection.');
          poll();
        }
      }
    }catch(e){
      console.error('Join error', e);
    }finally{
      isJoining=false;
      currentSyncPromise = null;
      if(pendingSelection !== null){
        syncBoardSelection();
      }
    }
  })();
  return currentSyncPromise;
}

async function pickBoard(num){
  if(countdownActive && lastDisplayedSec !== null && lastDisplayedSec >= 0 && lastDisplayedSec <= 2){
    showToast('⏳ ጨዋታው ሊጀምር ነው! የካርቴላ ምርጫ ተዘግቷል። (Game starting!)');
    return;
  }
  let nextBoards=[...selectedBoards];
  if(nextBoards.includes(num)){
    // Tapped an already selected board: deselect it (even if only 1!)
    nextBoards=nextBoards.filter(b=>b!==num);
  }else{
    // Adding a new board (up to 2)
    if(nextBoards.length<2){
      nextBoards.push(num);
    }else{
      nextBoards[1]=num;
    }
  }

  selectedBoards=nextBoards;
  renderPreviews();
  updateStakeDisplay();
  if(cachedBoards.length>0) renderBoards(cachedBoards);

  pendingSelection=nextBoards;
  syncBoardSelection();
}

async function removeBoard(num){
  if(countdownActive && lastDisplayedSec !== null && lastDisplayedSec >= 0 && lastDisplayedSec <= 2){
    showToast('⏳ ጨዋታው ሊጀምር ነው! የካርቴላ ምርጫ ተዘግቷል። (Game starting!)');
    return;
  }
  const nextBoards=selectedBoards.filter(b=>b!==num);
  selectedBoards=nextBoards;
  renderPreviews();
  updateStakeDisplay();
  if(cachedBoards.length>0) renderBoards(cachedBoards);

  pendingSelection=nextBoards;
  syncBoardSelection();
}

async function exitGame(){
  if(smoothTimer){ clearInterval(smoothTimer); smoothTimer=null; }
  if(selectedBoards.length>0){
    try{
      await fetch('/api/leave',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({userId,bet,room})
      });
    }catch(e){}
  }
  window.location.href=`/index.html?userId=${userId}`;
}

function updateCountdownTarget(serverSecs){
  const s = parseInt(serverSecs, 10) || 0;
  const now = Date.now();
  if(s > 0){
    const incomingEndTime = now + (s * 1000);
    // If not running, or server is closer to zero, or drift > 1.2s
    if(!countdownActive || incomingEndTime < targetEndTime || Math.abs(incomingEndTime - targetEndTime) > 1200){
      targetEndTime = incomingEndTime;
      countdownActive = true;
    }
    if(!smoothTimer){
      startSmoothTimer();
    }
  } else {
    // Lobby empty / waiting - no active countdown on server
    countdownActive = false;
    targetEndTime = 0;
    if(smoothTimer){ clearInterval(smoothTimer); smoothTimer = null; }
    document.getElementById('timer').textContent = '30';
    lastDisplayedSec = -1;
  }
}

function startSmoothTimer(){
  if(smoothTimer) clearInterval(smoothTimer);
  smoothTimer = setInterval(async ()=>{
    if(!countdownActive || targetEndTime <= 0) return;
    const now = Date.now();
    const remaining = Math.max(0, Math.ceil((targetEndTime - now) / 1000));

    // Update screen display only when the whole second tick changes
    if(remaining !== lastDisplayedSec){
      lastDisplayedSec = remaining;
      document.getElementById('timer').textContent = remaining;
    }

    if(remaining <= 0 && countdownActive){
      countdownActive = false;
      clearInterval(smoothTimer);
      smoothTimer = null;
      document.getElementById('timer').textContent = '0';

      // If a board selection sync is currently in-flight, await it up to 1.5s
      if(isJoining || pendingSelection !== null){
        try{
          await Promise.race([
            currentSyncPromise,
            new Promise(r => setTimeout(r, 1500))
          ]);
        }catch(e){}
      }

      const boardsToPlay = confirmedBoards.length > 0 ? confirmedBoards : selectedBoards;

      if(boardsToPlay.length > 0 && !redirected){
        redirected = true;
        try{
          await fetch('/api/start-game',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({bet,room})
          });
        }catch(e){}
        window.location.href = `/game.html?userId=${userId}&bet=${bet}&room=${room}&boards=${boardsToPlay.join(',')}&auto=${autoEnabled?'1':'0'}&sound=${soundEnabled?'1':'0'}&v=${Date.now()}`;
      } else if (!redirected) {
        redirected = true;
        window.location.href = `/game.html?userId=${userId}&bet=${bet}&room=${room}&spectator=1&auto=${autoEnabled?'1':'0'}&sound=${soundEnabled?'1':'0'}&v=${Date.now()}`;
      }
    }
  }, 250);
}

async function loadBalance(){
  try{
    if(!userId || userId==='0') {
      window.location.href = `/index.html?userId=${userId || '0'}`;
      return;
    }
    const r=await fetch(`/api/profile/${userId}`, {
      headers: {
        'x-telegram-init-data': window.Telegram?.WebApp?.initData || '',
        'x-player-token': token || ''
      }
    });
    if(r.status === 404 || r.status === 401 || r.status === 403){
      window.location.href = `/index.html?userId=${userId}`;
      return;
    }
    if(!r.ok) return;
    const d=await r.json();
    if(d.error){
      window.location.href = `/index.html?userId=${userId}`;
      return;
    }
    const bal=d.balance!==undefined?Number(d.balance):(d.user&&d.user.balance!==undefined?Number(d.user.balance):0);
    const bon=d.bonus!==undefined?Number(d.bonus):(d.user&&d.user.bonus!==undefined?Number(d.user.bonus):0);
    const total=bal+bon;
    document.getElementById('wallet-val').textContent=(total % 1 === 0 ? total : total.toFixed(2));
  }catch(e){}
}

async function poll(){
  const pollStart = Date.now();
  try{
    const [boardRes,stateRes]=await Promise.all([
      fetch(`/api/boards?bet=${bet}&room=${room}`),
      fetch(`/api/game-state/${userId}?bet=${bet}&room=${room}`)
    ]);
    const boardData=await boardRes.json();
    const stateData=await stateRes.json();

    if(!isJoining && pendingSelection === null && pollStart >= lastSyncTimestamp){
      if(stateData.inGame){
        if(stateData.boardNumbers && stateData.boardNumbers.length > 0){
          confirmedBoards = [...stateData.boardNumbers];
          selectedBoards = [...stateData.boardNumbers];
        }else if(stateData.boardNumber){
          confirmedBoards = [stateData.boardNumber];
          selectedBoards = [stateData.boardNumber];
        }
      }else{
        confirmedBoards = [];
        selectedBoards = [];
      }
      renderPreviews();
      updateStakeDisplay();
    }

    if(boardData.shuffleSeed !== undefined && boardData.shuffleSeed !== currentShuffleSeed){
      currentShuffleSeed = boardData.shuffleSeed;
      try { sessionStorage.setItem('lastShuffleSeed', currentShuffleSeed); } catch(e){}
      renderPreviews();
    }

    if(boardData.lobbyCountdown !== undefined){
      updateCountdownTarget(boardData.lobbyCountdown);
    }

    if(boardData.players !== undefined){
      const rpEl = document.getElementById('room-players');
      const rbEl = document.getElementById('room-boards');
      const rdEl = document.getElementById('room-derash');
      if(rpEl) rpEl.textContent = boardData.players;
      if(rbEl) rbEl.textContent = boardData.boardCount || boardData.players;
      if(rdEl) rdEl.textContent = Math.floor(parseFloat(boardData.pot || 0) * 0.8);
    }

    renderBoards(boardData.taken || boardData.boards || []);

    if(boardData.gameState==='PLAYING' && !redirected){
      redirected = true;
      if(smoothTimer) clearInterval(smoothTimer);
      const boardsToPlay = confirmedBoards.length > 0 ? confirmedBoards : selectedBoards;
      if(boardsToPlay.length > 0){
        window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&boards=${boardsToPlay.join(',')}&auto=${autoEnabled?'1':'0'}&sound=${soundEnabled?'1':'0'}&v=${Date.now()}`;
      } else {
        // Player has NO boards selected: redirect to game as spectator
        window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&spectator=1&auto=${autoEnabled?'1':'0'}&sound=${soundEnabled?'1':'0'}&v=${Date.now()}`;
      }
    }
  }catch(e){console.error('poll error',e);}
}

let pollTimer = null;
let bgHeartbeatTimer = null;

function startLobbyPolling() {
  if (pollTimer) clearInterval(pollTimer);
  stopBackgroundHeartbeat();
  poll();
  pollTimer = setInterval(poll, 3500);
}

function stopLobbyPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function startBackgroundHeartbeat() {
  stopLobbyPolling();
  if (bgHeartbeatTimer) clearInterval(bgHeartbeatTimer);
  poll();
  bgHeartbeatTimer = setInterval(poll, 6000); // 6s heartbeat keeps player.lastSeen active on server
}

function stopBackgroundHeartbeat() {
  if (bgHeartbeatTimer) {
    clearInterval(bgHeartbeatTimer);
    bgHeartbeatTimer = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (selectedBoards.length > 0) {
      // Player has selected board(s): keep heartbeat alive so server never evicts them
      startBackgroundHeartbeat();
    } else {
      // Idle spectator with no boards: stop polling to save bandwidth
      stopLobbyPolling();
      stopBackgroundHeartbeat();
    }
  } else {
    // Returning to tab: resume full polling and sync immediately
    stopBackgroundHeartbeat();
    startLobbyPolling();
  }
});

loadBalance();
startLobbyPolling();
</script>
