<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ethio Bingo — Choose Boards</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:#dcd0ea;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  width:100%;max-width:440px;margin:0 auto;
  padding-bottom:75px;
  color:#2c1b4d;
}

/* ─── Top App Header ─── */
.app-header{
  width:100%;background:#1e1a38;color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 12px;font-size:0.95rem;font-weight:800;
}
.app-header-left{display:flex;align-items:center;gap:10px;cursor:pointer;}
.app-header-left .close-icon{font-size:1.1rem;font-weight:700;}
.app-header-title{font-size:0.95rem;font-weight:800;letter-spacing:0.3px;}
.app-header-right{display:flex;align-items:center;gap:10px;color:#ccc;font-size:1rem;}

/* ─── Top Action & Stats Bar (5 Items - Reference Image) ─── */
.top-action-bar{
  width:100%;
  display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr 1.1fr;
  gap:4px;padding:6px 8px 4px;
}
.top-btn{
  background:#5e1261;color:#fff;border:none;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 2px;cursor:pointer;
  box-shadow:0 1px 4px rgba(94,18,97,0.25);
  transition:transform 0.1s;
}
.top-btn:active{transform:scale(0.95);}
.top-btn .t-icon{font-size:0.9rem;margin-bottom:1px;}
.top-btn .t-label{font-size:0.68rem;font-weight:800;}

.top-pill{
  background:#fff;border:1px solid #c9b3e8;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3px 2px;text-align:center;
  box-shadow:0 1px 3px rgba(74,21,75,0.08);
}
.top-pill .p-label{
  font-size:0.55rem;color:#6b4d8a;font-weight:800;margin-bottom:1px;
}
.top-pill .p-value{
  font-size:0.75rem;font-weight:900;color:#3b1e5a;
}

/* Prominent Orange Countdown Box (Item 2) */
.countdown-pill{
  background:#fff;border:1px solid #c9b3e8;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(243,156,18,0.15);
}
.countdown-pill .cd-val{
  font-size:1.4rem;font-weight:900;color:#f39c12;line-height:1;
}

/* ─── Sub-Header Status Row (Reference Image) ─── */
.status-sub-row{
  width:100%;padding:4px 10px 4px;
  display:flex;align-items:center;justify-content:space-between;
}
.sub-boards-label{
  color:#27ae60;font-size:0.85rem;font-weight:900;
}
.sub-stake-label{
  color:#27ae60;font-size:0.85rem;font-weight:900;
}

/* ─── Range Selector Tabs (Smooth 1-500 Navigation) ─── */
.range-tabs{
  width:100%;padding:0 8px 4px;
  display:flex;gap:4px;overflow-x:auto;
}
.range-tabs::-webkit-scrollbar{display:none;}
.range-tab-btn{
  background:#ece3f7;border:1px solid #c9b3e8;border-radius:12px;
  padding:3px 8px;font-size:0.62rem;font-weight:800;color:#5e1261;
  white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.range-tab-btn.active{
  background:#5e1261;color:#fff;border-color:#5e1261;
}

/* ─── Board Grid Card Container (Reference Image) ─── */
.board-grid-wrapper{
  width:calc(100% - 12px);
  background:#ece3f7;border:1.5px solid #c9b3e8;
  border-radius:16px;padding:6px;
  box-shadow:0 2px 8px rgba(74,21,75,0.08);
}
.board-grid{
  display:grid;grid-template-columns:repeat(9, minmax(0, 1fr));
  gap:3px;max-height:360px;overflow-y:auto;
  padding:2px;
}
.board-grid::-webkit-scrollbar{width:4px;}
.board-grid::-webkit-scrollbar-thumb{background:#c2b1db;border-radius:4px;}

.board-cell{
  aspect-ratio:1.15;border-radius:6px;border:none;
  display:flex;align-items:center;justify-content:center;
  font-size:0.68rem;font-weight:800;cursor:pointer;
  transition:all 0.1s;user-select:none;
  box-shadow:0 1px 2px rgba(0,0,0,0.08);
  /* Default / Unselected: Neutral light lavender-grey (Reference Image) */
  background:#c2b1db;color:#2c1b4d;
}
.board-cell:active{transform:scale(0.92);}

/* Taken by Other Players: Solid Orange (Reference Image) */
.board-cell.taken{
  background:#ff7a00;color:#fff;font-weight:900;
  cursor:not-allowed;box-shadow:0 1px 3px rgba(255,122,0,0.3);
}

/* Selected by Current User: Solid Green (Reference Image) */
.board-cell.selected{
  background:#27ae60;color:#fff;font-weight:900;
  box-shadow:0 0 8px rgba(39,174,96,0.6);
  animation:sel-pulse 1s infinite alternate;
}
@keyframes sel-pulse{
  from{box-shadow:0 0 4px #27ae60;}to{box-shadow:0 0 10px #27ae60;}
}

/* ─── Selected Board Preview Section (at bottom of board selection page) ─── */
.previews-wrapper{
  width:calc(100% - 12px);max-width:420px;
  margin:6px auto 0;
}
.previews-title-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:4px 6px 4px;
  font-size:0.75rem;font-weight:900;color:#5e1261;
}
.previews-hint{
  font-size:0.62rem;font-weight:700;color:#f39c12;
}
.previews-container{
  display:flex;gap:6px;justify-content:center;align-items:flex-start;
  flex-wrap:wrap;
}
.board-preview-card{
  flex:1 1 145px;max-width:190px;
  background:#fff;border-radius:10px;padding:5px;
  box-shadow:0 2px 8px rgba(94,18,97,0.12);
  border:1px solid #c9b3e8;
}
.preview-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:3px;padding-bottom:2px;border-bottom:1px solid #f0e6f7;
}
.preview-title{color:#5e1261;font-size:0.72rem;font-weight:900;}
.preview-remove-btn{
  background:#d32f2f;color:#fff;border:none;border-radius:4px;
  padding:1px 5px;font-size:0.58rem;font-weight:900;cursor:pointer;
}
.preview-bingo-letters{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:1.5px;margin-bottom:1.5px;
}
.p-letter{
  padding:2px 0;text-align:center;color:#fff;
  font-weight:900;font-size:0.62rem;border-radius:2px;
}
.bl-B{background:#f39c12;}
.bl-I{background:#27ae60;}
.bl-N{background:#2980b9;}
.bl-G{background:#e74c3c;}
.bl-O{background:#8e44ad;}
.preview-grid{
  display:grid;grid-template-columns:repeat(5,1fr);
  gap:1.5px;background:#e8d5f5;padding:1.5px;border-radius:4px;
}
.p-cell{
  background:#fff;aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;
  font-size:0.58rem;font-weight:800;color:#333;border-radius:2px;
}
.p-cell.free{
  background:#8e44ad;color:#fff;font-size:0.42rem;font-weight:900;
}

/* ─── Bottom App Navigation Bar ─── */
.bottom-nav-bar{
  position:fixed;bottom:0;left:0;width:100%;
  background:#fff;border-top:1px solid #dcd0ea;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:4px 0 6px;z-index:95;
  max-width:440px;left:50%;transform:translateX(-50%);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:#888;text-decoration:none;font-size:0.62rem;font-weight:700;
  cursor:pointer;
}
.nav-item.active{color:#5e1261;}
.nav-item.active .nav-icon-bg{
  background:#5e1261;color:#fff;border-radius:12px;padding:2px 12px;
}
.nav-icon{font-size:1.05rem;}
</style>
</head>
<body>

<!-- ─── Top App Header ─── -->
<div class="app-header">
  <div class="app-header-left" onclick="exitGame()">
    <span class="close-icon">✕</span>
    <span class="app-header-title">Ethio Bingo</span>
  </div>
  <div class="app-header-right">
    <span>⌵</span>
    <span>⋮</span>
  </div>
</div>

<!-- ─── Top Action & Stats Bar (5 Items - Reference Image) ─── -->
<div class="top-action-bar">
  <button class="top-btn" onclick="exitGame()">
    <span class="t-icon">←</span>
    <span class="t-label">Leave</span>
  </button>
  <div class="countdown-pill">
    <span class="cd-val" id="timer">30</span>
  </div>
  <div class="top-pill">
    <span class="p-label">Wallet</span>
    <span class="p-value" id="wallet-val">—</span>
  </div>
  <div class="top-pill">
    <span class="p-label">Stake</span>
    <span class="p-value" id="stake-val">—</span>
  </div>
  <button class="top-btn" onclick="poll()">
    <span class="t-icon">↻</span>
    <span class="t-label">Refresh</span>
  </button>
</div>

<!-- ─── Sub-Header Status Row (Reference Image) ─── -->
<div class="status-sub-row">
  <span class="sub-boards-label" id="boards-counter">Boards: 0/2</span>
  <span class="sub-stake-label" id="stake-label">10 № 1</span>
</div>

<!-- ─── Quick Jump Range Tabs (1-500) ─── -->
<div class="range-tabs" id="range-tabs">
  <button class="range-tab-btn active" onclick="filterRange(0, 500, this)">All 1–500</button>
  <button class="range-tab-btn" onclick="filterRange(1, 100, this)">1–100</button>
  <button class="range-tab-btn" onclick="filterRange(101, 200, this)">101–200</button>
  <button class="range-tab-btn" onclick="filterRange(201, 300, this)">201–300</button>
  <button class="range-tab-btn" onclick="filterRange(301, 400, this)">301–400</button>
  <button class="range-tab-btn" onclick="filterRange(401, 500, this)">401–500</button>
</div>

<!-- ─── Board Grid Card Container (Reference Image) ─── -->
<div class="board-grid-wrapper">
  <div class="board-grid" id="board-grid"></div>
</div>

<!-- ─── Selected Board Preview Section ─── -->
<div class="previews-wrapper" id="previews-wrapper" style="display:none;">
  <div class="previews-title-bar">
    <span id="previews-summary">📋 Selected: 0/2 Boards</span>
    <span class="previews-hint" id="previews-hint">Select up to 2 boards</span>
  </div>
  <div class="previews-container" id="previews-container"></div>
</div>

<!-- ─── Bottom App Navigation Bar ─── -->
<div class="bottom-nav-bar">
  <div class="nav-item active" onclick="exitGame()">
    <div class="nav-icon-bg"><span class="nav-icon">🎮</span></div>
    <span>Game</span>
  </div>
  <a class="nav-item" id="nav-history" href="/history.html">
    <span class="nav-icon">🕒</span>
    <span>History</span>
  </a>
  <a class="nav-item" id="nav-wallet" href="/wallet.html">
    <span class="nav-icon">💼</span>
    <span>Wallet</span>
  </a>
  <a class="nav-item" id="nav-profile" href="/profile.html">
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </a>
</div>

<script>
if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
const params=new URLSearchParams(location.search);
let userId=params.get('userId');
if(!userId || userId==='0'){
  if(window.Telegram?.WebApp?.initDataUnsafe?.user?.id){
    userId=String(Telegram.WebApp.initDataUnsafe.user.id);
  } else {
    try { userId=sessionStorage.getItem('bingo_userId')||'0'; } catch(e){ userId='0'; }
  }
}
if(userId && userId!=='0'){
  try { sessionStorage.setItem('bingo_userId', userId); } catch(e){}
}
const bet=params.get('bet')||'10';
const room=params.get('room')||'1';

// Setup nav links
document.getElementById('nav-history').href=`/history.html?userId=${userId}`;
document.getElementById('nav-wallet').href=`/wallet.html?userId=${userId}`;
document.getElementById('nav-profile').href=`/profile.html?userId=${userId}`;

let selectedBoards=[]; // Array of 1 or 2 board numbers
let isJoining=false;
let cachedBoards=[];
let currentRange={min:1, max:500};
let targetEndTime=0;
let countdownActive=false;
let smoothTimer=null;
let lastDisplayedSec=-1;
let redirected=false;

// Set initial labels
document.getElementById('stake-label').textContent=`${bet} № ${room}`;
document.getElementById('timer').textContent='30';
updateStakeDisplay();

function updateStakeDisplay(){
  const count=selectedBoards.length;
  const total=count*parseInt(bet,10);
  document.getElementById('stake-val').textContent=`${total}`;
  document.getElementById('boards-counter').textContent=`Boards: ${count}/2`;
}

function filterRange(min, max, btn){
  currentRange={min, max};
  document.querySelectorAll('.range-tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(cachedBoards.length>0) renderBoards(cachedBoards);
}

function mulberry32(seed){
  return function(){
    seed|=0;seed=(seed+0x6D2B79F5)|0;
    let t=Math.imul(seed^(seed>>>15),1|seed);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}

function generateTicketClient(seed){
  const rand=mulberry32(seed);
  const ticket=[];
  for(let i=0;i<5;i++) ticket[i]=[];
  const ranges=[
    {min:1,max:15},{min:16,max:30},{min:31,max:45},{min:46,max:60},{min:61,max:75}
  ];
  for(let col=0;col<5;col++){
    const numbers=new Set();
    while(numbers.size<5){
      const num=Math.floor(rand()*(ranges[col].max-ranges[col].min+1))+ranges[col].min;
      numbers.add(num);
    }
    const colNums=Array.from(numbers);
    for(let row=0;row<5;row++){
      if(col===2&&row===2){
        ticket[row][col]=0;
      }else{
        ticket[row][col]=colNums[row];
      }
    }
  }
  return ticket;
}

function renderPreviews(){
  const wrapper=document.getElementById('previews-wrapper');
  const container=document.getElementById('previews-container');
  const summary=document.getElementById('previews-summary');
  const hint=document.getElementById('previews-hint');

  if(!selectedBoards||selectedBoards.length===0){
    wrapper.style.display='none';
    return;
  }

  wrapper.style.display='block';
  summary.textContent=`📋 Selected: ${selectedBoards.length}/2 Board${selectedBoards.length>1?'s':''}`;
  hint.textContent=selectedBoards.length===1?'Tap another board to play 2 boards':'Tap a board or ✕ to change';

  container.innerHTML=selectedBoards.map(boardNum=>{
    const ticket=generateTicketClient(boardNum);
    let gridHtml='';
    for(let r=0;r<5;r++){
      for(let c=0;c<5;c++){
        const num=ticket[r][c];
        if(num===0){
          gridHtml+=`<div class="p-cell free">FREE</div>`;
        }else{
          gridHtml+=`<div class="p-cell">${num}</div>`;
        }
      }
    }
    return `
      <div class="board-preview-card">
        <div class="preview-header">
          <span class="preview-title">Board #${boardNum}</span>
          ${selectedBoards.length>1?`<button class="preview-remove-btn" onclick="removeBoard(${boardNum})">✕</button>`:''}
        </div>
        <div class="preview-bingo-letters">
          <div class="p-letter bl-B">B</div>
          <div class="p-letter bl-I">I</div>
          <div class="p-letter bl-N">N</div>
          <div class="p-letter bl-G">G</div>
          <div class="p-letter bl-O">O</div>
        </div>
        <div class="preview-grid">${gridHtml}</div>
      </div>
    `;
  }).join('');
}

function renderBoards(boards){
  cachedBoards=boards;
  const grid=document.getElementById('board-grid');
  
  // Filter boards by range if range is not 0 (all)
  const visibleBoards = (currentRange.min === 0)
    ? boards
    : boards.filter(b => b.number >= currentRange.min && b.number <= currentRange.max);

  grid.innerHTML=visibleBoards.map(b=>{
    let cls='board-cell';
    const isMine=selectedBoards.includes(b.number);
    if(isMine) cls+=' selected';
    else if(b.taken) cls+=' taken';
    const disabled=b.taken&&!isMine;
    return `<button class="${cls}" onclick="pickBoard(${b.number})" ${disabled?'disabled':''}>${b.number}</button>`;
  }).join('');
}

let pendingSelection=null;

async function syncBoardSelection(){
  if(isJoining) return;
  isJoining=true;
  try{
    while(pendingSelection !== null){
      const boardsToSync = pendingSelection;
      pendingSelection = null;
      const res = await fetch('/api/join',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({userId,boards:boardsToSync,bet,room})
      });
      const data = await res.json();
      if(data.success){
        if(data.boards && Array.isArray(data.boards)) selectedBoards=data.boards;
        renderPreviews();
        updateStakeDisplay();
        if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.notificationOccurred('success');
        poll();
        loadBalance();
      }else{
        if(data.msg && data.msg.toLowerCase().includes('in progress')){
          redirected = true;
          if(smoothTimer) clearInterval(smoothTimer);
          window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&spectator=1&v=${Date.now()}`;
          return;
        }
        alert(data.msg||'Failed to update board selection.');
        poll();
      }
    }
  }catch(e){
    console.error('Join error', e);
  }finally{
    isJoining=false;
    if(pendingSelection !== null){
      syncBoardSelection();
    }
  }
}

async function pickBoard(num){
  let nextBoards=[...selectedBoards];
  if(nextBoards.includes(num)){
    // Tapped an already selected board: deselect it (even if only 1!)
    nextBoards=nextBoards.filter(b=>b!==num);
  }else{
    // Adding a new board (up to 2)
    if(nextBoards.length<2){
      nextBoards.push(num);
    }else{
      nextBoards[1]=num;
    }
  }

  selectedBoards=nextBoards;
  renderPreviews();
  updateStakeDisplay();
  if(cachedBoards.length>0) renderBoards(cachedBoards);

  pendingSelection=nextBoards;
  syncBoardSelection();
}

async function removeBoard(num){
  const nextBoards=selectedBoards.filter(b=>b!==num);
  selectedBoards=nextBoards;
  renderPreviews();
  updateStakeDisplay();
  if(cachedBoards.length>0) renderBoards(cachedBoards);

  pendingSelection=nextBoards;
  syncBoardSelection();
}

async function exitGame(){
  if(smoothTimer){ clearInterval(smoothTimer); smoothTimer=null; }
  if(selectedBoards.length>0){
    try{
      await fetch('/api/leave',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({userId,bet,room})
      });
    }catch(e){}
  }
  window.location.href=`/index.html?userId=${userId}`;
}

// Automatically release board if user closes Telegram WebApp or browser tab
window.addEventListener('pagehide', () => {
  if (selectedBoards.length > 0 && !redirected && userId && userId !== '0') {
    const payload = JSON.stringify({ userId, bet, room });
    if (navigator.sendBeacon) {
      navigator.sendBeacon('/api/leave', new Blob([payload], { type: 'application/json' }));
    }
  }
});

function updateCountdownTarget(serverSecs){
  const s = parseInt(serverSecs, 10) || 0;
  const now = Date.now();
  if(s > 0){
    const incomingEndTime = now + (s * 1000);
    // If not running, or if server drifted significantly (> 2.5s offset, e.g. new game/reset)
    if(!countdownActive || Math.abs(incomingEndTime - targetEndTime) > 2500){
      targetEndTime = incomingEndTime;
      countdownActive = true;
    }
    if(!smoothTimer){
      startSmoothTimer();
    }
  } else {
    // Lobby empty / waiting - no active countdown on server
    countdownActive = false;
    targetEndTime = 0;
    if(smoothTimer){ clearInterval(smoothTimer); smoothTimer = null; }
    document.getElementById('timer').textContent = '30';
    lastDisplayedSec = -1;
  }
}

function startSmoothTimer(){
  if(smoothTimer) clearInterval(smoothTimer);
  smoothTimer = setInterval(async ()=>{
    if(!countdownActive || targetEndTime <= 0) return;
    const now = Date.now();
    const remaining = Math.max(0, Math.ceil((targetEndTime - now) / 1000));

    // Update screen display only when the whole second tick changes
    if(remaining !== lastDisplayedSec){
      lastDisplayedSec = remaining;
      document.getElementById('timer').textContent = remaining;
    }

    if(remaining <= 0 && countdownActive){
      countdownActive = false;
      clearInterval(smoothTimer);
      smoothTimer = null;
      document.getElementById('timer').textContent = '0';

      if(selectedBoards.length > 0 && !redirected){
        // Player has selected board(s) -> Start game and navigate to game.html
        redirected = true;
        try{
          await fetch('/api/start-game',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({bet,room})
          });
        }catch(e){}
        window.location.href = `/game.html?userId=${userId}&bet=${bet}&room=${room}&boards=${selectedBoards.join(',')}&v=${Date.now()}`;
      } else if (!redirected) {
        // Player has NO selected boards: smoothly transition to spectator mode!
        redirected = true;
        window.location.href = `/game.html?userId=${userId}&bet=${bet}&room=${room}&spectator=1&v=${Date.now()}`;
      }
    }
  }, 250);
}

async function loadBalance(){
  try{
    if(!userId || userId==='0') return;
    const r=await fetch(`/api/profile/${userId}`);
    if(!r.ok) return;
    const d=await r.json();
    const bal=d.balance!==undefined?Number(d.balance):(d.user&&d.user.balance!==undefined?Number(d.user.balance):0);
    const bon=d.bonus!==undefined?Number(d.bonus):(d.user&&d.user.bonus!==undefined?Number(d.user.bonus):0);
    const total=bal+bon;
    document.getElementById('wallet-val').textContent=(total % 1 === 0 ? total : total.toFixed(2));
  }catch(e){}
}

async function poll(){
  try{
    const [boardRes,stateRes]=await Promise.all([
      fetch(`/api/boards?bet=${bet}&room=${room}`),
      fetch(`/api/game-state/${userId}?bet=${bet}&room=${room}`)
    ]);
    const boardData=await boardRes.json();
    const stateData=await stateRes.json();

    if(!isJoining){
      if(stateData.inGame){
        if(stateData.boardNumbers && stateData.boardNumbers.length > 0){
          selectedBoards=stateData.boardNumbers;
        }else if(stateData.boardNumber){
          selectedBoards=[stateData.boardNumber];
        }
      }else{
        selectedBoards=[];
      }
      renderPreviews();
      updateStakeDisplay();
    }

    if(boardData.lobbyCountdown !== undefined){
      updateCountdownTarget(boardData.lobbyCountdown);
    }

    renderBoards(boardData.boards||[]);

    if(boardData.gameState==='PLAYING' && !redirected){
      redirected = true;
      if(smoothTimer) clearInterval(smoothTimer);
      if(selectedBoards.length > 0){
        window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&boards=${selectedBoards.join(',')}&v=${Date.now()}`;
      } else {
        // Player has NO boards selected: redirect to game as spectator
        window.location.href=`/game.html?userId=${userId}&bet=${bet}&room=${room}&spectator=1&v=${Date.now()}`;
      }
    }
  }catch(e){console.error('poll error',e);}
}

loadBalance();
poll();
setInterval(poll,2500);
</script>
</body>
</html>
